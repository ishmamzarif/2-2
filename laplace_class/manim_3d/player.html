<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laplace 3D Player</title>
<style>
  :root { --bg: #0c0c0f; --fg: #ececf0; --muted: #a0a0aa; --accent: #f7d96f; --panel: rgba(18, 18, 24, 0.94); --line: #2a2a33; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; padding: 12px 18px;
         background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); transition: opacity .4s; z-index: 3; }
  #bar.hide { opacity: 0; }
  #where { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #where b { color: var(--accent); font-weight: 600; }
  #where span { color: var(--muted); }
  button { background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
           padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.16); }
  #notes { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(920px, calc(100% - 32px));
           box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 14px 18px; display: none; z-index: 3; }
  #notes.show { display: block; }
  #notes .label { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  #notes .next { color: var(--muted); margin-top: 8px; font-size: 13px; }
  #list { position: fixed; top: 0; bottom: 0; left: 0; width: min(380px, 90vw); background: var(--panel);
          border-right: 1px solid var(--line); overflow-y: auto; transform: translateX(-102%); transition: transform .25s; z-index: 4; }
  #list.open { transform: none; }
  #list h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 18px 6px; }
  .scene { padding: 8px 18px; cursor: pointer; border-top: 1px solid var(--line); }
  .scene:hover { background: rgba(255,255,255,.05); }
  .scene.cur > .st { color: var(--accent); }
  .scene .st { font-weight: 600; }
  .scene .meta { color: var(--muted); font-size: 12px; }
  .beat { padding: 3px 0 3px 14px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .beat:hover, .beat.cur { color: var(--fg); }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line);
          border-radius: 14px; padding: 22px 26px; max-width: 520px; z-index: 5; display: none; }
  #hint.show { display: block; }
  #hint kbd { display: inline-block; min-width: 22px; text-align: center; padding: 1px 6px; border: 1px solid var(--line);
              border-radius: 5px; background: rgba(255,255,255,.06); font: 13px ui-monospace, monospace; }
  #hint td { padding: 3px 10px 3px 0; vertical-align: top; }
  #black { position: fixed; inset: 0; background: #000; z-index: 6; display: none; }
  #black.on { display: block; }
  #missing { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); z-index: 2; display: none;
             text-align: center; }
  @media (max-width: 640px) { #bar { padding: 10px 16px; } #bar button.wide { display: none; } }
</style>
</head>
<body>
<video id="v" playsinline preload="auto"></video>
<div id="missing"></div>
<div id="bar">
  <button id="bList" title="Scene list (L)">&#9776;</button>
  <div id="where"></div>
  <button id="bPrev" title="Back one pause (&larr;)">&#9664;</button>
  <button id="bNext" title="Play to next pause (Space)">&#9654;</button>
  <button id="bNotes" class="wide" title="Talking points (N)">Notes</button>
  <button id="bFull" class="wide" title="Fullscreen (F)">&#x26F6;</button>
  <button id="bHelp" title="Keys (?)">?</button>
</div>
<div id="notes"><div class="label"></div><div class="text"></div><div class="next"></div></div>
<nav id="list"></nav>
<div id="hint">
  <table>
    <tr><td><kbd>Space</kbd> <kbd>&rarr;</kbd> <kbd>PgDn</kbd></td><td>play to the next pause point (while playing: jump there)</td></tr>
    <tr><td><kbd>&larr;</kbd> <kbd>PgUp</kbd></td><td>back one pause point</td></tr>
    <tr><td><kbd>]</kbd> <kbd>[</kbd></td><td>next / previous scene</td></tr>
    <tr><td><kbd>Home</kbd></td><td>restart this scene</td></tr>
    <tr><td><kbd>N</kbd></td><td>talking points (keep hidden if the screen is mirrored)</td></tr>
    <tr><td><kbd>L</kbd></td><td>scene list</td></tr>
    <tr><td><kbd>F</kbd></td><td>fullscreen</td></tr>
    <tr><td><kbd>B</kbd> <kbd>.</kbd></td><td>black screen</td></tr>
  </table>
  <p style="color:var(--muted);margin:12px 0 0">Press any key to close.</p>
</div>
<div id="black"></div>
<script>
const DATA = [{"n": 0, "cls": "BigPicture", "title": "The big picture", "part": "What it is", "file": "00_BigPicture.mp4", "exists": true, "duration": 27.3, "beats": [{"t": 2.0, "label": "a signal in time", "note": "This is a damped oscillation, x(t) = e^(-0.5t) cos 2t for t ≥ 0. Today's question: what does the Laplace transform turn it into?"}, {"t": 8.0, "label": "becomes a landscape over the s-plane", "note": "It becomes a function X(s) on the complex s-plane. We draw its size |X(s)| as a height, so we get a landscape. The bright part of the floor is the region of convergence (ROC); outside it the surface is ghosted."}, {"t": 13.5, "label": "poles: the decay rate and the frequency", "note": "The two spikes are poles at s = -0.5 ± 2j. Their real part (-0.5) is the decay rate of x(t); their imaginary part (±2) is its frequency. Where the spikes stand tells you how the signal behaves."}, {"t": 17.0, "label": "Fourier is one slice of it", "note": "The yellow curve is the landscape along the jω-axis (σ = 0). That slice is |X(jω)|, the Fourier transform. Laplace keeps the whole plane; Fourier is one line of it."}, {"t": 19.5, "label": "the formula we will unpack", "note": "The formula we will build up to: X(s) = integral of x(t) e^(-st) dt. Every piece of it gets its own picture."}, {"t": 25.8, "label": "roadmap", "note": "Plan: background (complex numbers, e^(st), integrals, Fourier), where Laplace comes from (LTI systems), what it is, how it is used, the ROC, and the inverse transform."}]}, {"n": 1, "cls": "ComplexToEuler", "title": "Complex numbers and Euler's formula", "part": "Background", "file": "01_ComplexToEuler.mp4", "exists": true, "duration": 109.8, "beats": [{"t": 2.3, "label": "the complex plane", "note": "A complex number is a point, or an arrow from the origin, in a plane: horizontal = real part, vertical = imaginary part."}, {"t": 5.1, "label": "z = a + jb", "note": "z = a + jb: go a along the real axis and b along the imaginary axis. Engineers write j for the square root of -1."}, {"t": 10.7, "label": "multiply by j: rotate 90 degrees", "note": "Multiplying by j turns the arrow 90 degrees anticlockwise without changing its length."}, {"t": 15.7, "label": "j squared = -1", "note": "Do it twice: 180 degrees, the arrow points the opposite way. So j times j = -1. That is what j means geometrically."}, {"t": 19.2, "label": "polar form: length and angle", "note": "Any arrow is also described by its length r = |z| and its angle θ: z = r(cos θ + j sin θ)."}, {"t": 25.7, "label": "multiplying = rotate and scale", "note": "Multiplying by w scales by |w| and rotates by the angle of w: lengths multiply, angles add. Remember this: e^(-sτ) and H(s) later act on spirals exactly like this."}, {"t": 31.6, "label": "Euler's formula", "note": "e^(jθ) is the point on the unit circle at angle θ. Its horizontal shadow is cos θ and its vertical shadow is sin θ: e^(jθ) = cos θ + j sin θ."}, {"t": 39.1, "label": "any z = r e^{j theta}", "note": "So every complex number is z = r e^(jθ): a length times a pure rotation."}, {"t": 46.2, "label": "spinning as time passes", "note": "Now let the angle grow with time, θ = ωt. e^(jωt) is an arrow spinning at ω radians per second."}, {"t": 57.2, "label": "a helix: rotation + time", "note": "Give time its own axis. The tip traces a helix: rotation in the complex plane plus steady motion along t."}, {"t": 69.2, "label": "shadows: cos on the floor, sin on the wall", "note": "Look at the helix's shadows: on the floor (real part) we get cos ωt, on the back wall (imaginary part) sin ωt. Sinusoids are shadows of one spinning arrow."}, {"t": 80.7, "label": "omega: how fast it spins (sign = direction)", "note": "ω sets how fast it spins: bigger ω means tighter coils. A negative ω spins the other way."}, {"t": 88.5, "label": "two helices, opposite twist", "note": "e^(jωt) and e^(-jωt): same speed, opposite twist."}, {"t": 98.0, "label": "the sum stays in the real plane", "note": "Add them and halve: the yellow arrow always lies on the real axis, so the sum stays in the real plane."}, {"t": 102.0, "label": "side view: sin and -sin cancel", "note": "From the side, the imaginary parts are sin and -sin, and they cancel exactly."}, {"t": 106.0, "label": "top view: cos(omega t)", "note": "From above, the real parts agree: cos ωt = (e^(jωt) + e^(-jωt)) / 2. Real signals are pairs of opposite spirals, which is why the poles of real signals come in conjugate pairs."}]}, {"n": 2, "cls": "ComplexExponentials", "title": "The complex exponential e^{st}", "part": "Background", "file": "02_ComplexExponentials.mp4", "exists": true, "duration": 72.3, "beats": [{"t": 4.3, "label": "sigma < 0: decays", "note": "First the real exponential e^(σt). With σ < 0 it decays towards 0."}, {"t": 7.8, "label": "sigma = 0: constant", "note": "With σ = 0 it stays at 1."}, {"t": 10.8, "label": "sigma > 0: grows", "note": "With σ > 0 it grows without bound."}, {"t": 19.6, "label": "e^{st}: a spiral", "note": "Now make s = σ + jω complex. e^(st) = e^(σt) e^(jωt): the e^(jωt) part spins, the e^(σt) part sets the size. Together they make a spiral."}, {"t": 22.3, "label": "its envelope e^{sigma t}", "note": "The red funnel is the envelope e^(σt); the spiral always lies on it."}, {"t": 24.3, "label": "each s is one spiral", "note": "The small plane at the bottom left is the s-plane. Every point s picks out one spiral e^(st)."}, {"t": 27.8, "label": "left of the axis: shrinks", "note": "Left of the jω-axis (σ < 0) the funnel narrows and the spiral dies out."}, {"t": 31.8, "label": "on the j omega-axis: spins forever", "note": "On the jω-axis (σ = 0) it is a pure helix that never decays or grows. These are Fourier's building blocks, e^(jωt)."}, {"t": 35.8, "label": "right of the axis: grows", "note": "Right of the axis (σ > 0) the funnel widens and the spiral blows up."}, {"t": 46.5, "label": "omega: faster, slower, reversed", "note": "Moving up or down changes ω: faster spin, slower spin, or below the axis the spin reverses."}, {"t": 50.5, "label": "on the real axis: no spin", "note": "On the real axis (ω = 0) there is no spin at all, just e^(σt)."}, {"t": 55.5, "label": "the map of the s-plane", "note": "So the s-plane is a map of every exponential behaviour: left half decays, right half grows, the jω-axis oscillates forever."}, {"t": 65.3, "label": "conjugate pair = damped cosine", "note": "A point s and its mirror image s* give opposite spirals; their average is the real signal e^(σt) cos ωt, a damped cosine."}, {"t": 69.8, "label": "seen from above: e^{sigma t} cos(omega t)", "note": "Seen from above: the damped cosine. Real oscillating signals always come from such conjugate pairs."}]}, {"n": 3, "cls": "IntegralsConverge", "title": "Integrals and convergence", "part": "Background", "file": "03_IntegralsConverge.mp4", "exists": true, "duration": 60.2, "beats": [{"t": 10.3, "label": "to infinity: the area settles at 1", "note": "An integral adds up area. The area under e^(-t) from 0 to T grows with T but levels off at 1: the improper integral to ∞ converges."}, {"t": 20.3, "label": "a growing integrand: diverges", "note": "If the integrand grows, like e^(0.12t), the area keeps growing forever: the integral diverges. The Laplace transform is an integral to ∞, so convergence is the whole story."}, {"t": 27.6, "label": "the integrand: a shrinking spiral", "note": "Now a complex integrand: e^(-st) with s = 0.35 + 1.5j is a shrinking spiral (left). Integrating it means adding up tiny arrows."}, {"t": 38.6, "label": "the running total settles at 1/s", "note": "Right panel: the running total, the integral from 0 to T of e^(-st), drawn in the complex plane. Its velocity at each instant is the integrand (blue arrow). The spiral shrinks, so the steps shrink, and the path spirals into one point: 1/s."}, {"t": 44.1, "label": "different omega: still settles", "note": "Change ω: the limit point 1/s moves, but the path still settles."}, {"t": 49.1, "label": "sigma = 0: circles forever", "note": "At σ = 0 the integrand never shrinks: the running total goes round a circle forever and never settles."}, {"t": 53.6, "label": "sigma < 0: spirals out, diverges", "note": "With σ < 0 the steps grow and the path spirals outwards: the integral diverges. So the integral of e^(-st) from 0 to ∞ equals 1/s only when Re{s} > 0."}, {"t": 57.1, "label": "the size depends only on sigma", "note": "Why only σ matters: |e^(-st)| = e^(-σt). The jω part only rotates; the size, and so convergence, is decided by σ."}]}, {"n": 4, "cls": "FourierRecap", "title": "Fourier recap, and where it fails", "part": "Background", "file": "04_FourierRecap.mp4", "exists": true, "duration": 55.35, "beats": [{"t": 2.3, "label": "a pulse", "note": "Recall Fourier: a signal, here a rectangular pulse, can be built out of sinusoids."}, {"t": 8.35, "label": "each wave slides forward and adds in", "note": "Each lane holds one cosine at frequency ω with the right amplitude. Slide them forward and add: the yellow partial sum approaches the pulse."}, {"t": 16.55, "label": "13 sinusoids already make the pulse", "note": "With just 13 frequencies we already have the pulse, with ripples at the edges."}, {"t": 22.05, "label": "the spectrum: how much of each frequency", "note": "The heights of the waves, plotted against ω on the side wall, form the spectrum X(jω): how much of each frequency the signal contains."}, {"t": 24.55, "label": "and back: add them all up", "note": "Synthesis: x(t) = 1/(2π) times the integral of X(jω) e^(jωt) dω adds all the spinning arrows back together."}, {"t": 30.05, "label": "the waterfall from another angle", "note": "The same waterfall from another angle; for this pulse the spectrum is 2 sin(ω)/ω."}, {"t": 38.85, "label": "a growing spiral: the integral diverges", "note": "The problem: x(t) = e^(0.25t) u(t) grows. The Fourier integrand x(t) e^(-jωt) is a growing spiral and the integral diverges: no Fourier transform. The same happens for unstable systems."}, {"t": 41.35, "label": "idea: first multiply by e^{-sigma t}", "note": "Idea: first multiply by a decaying weight e^(-σt)."}, {"t": 45.35, "label": "sigma = 0.25: just balanced", "note": "At σ = 0.25 the weight exactly cancels the growth: the spiral neither grows nor shrinks, which is still not enough to converge."}, {"t": 50.35, "label": "weighted enough: it converges", "note": "For σ > 0.25 the weighted integrand shrinks and the integral converges."}, {"t": 52.85, "label": "Fourier of the weighted signal = Laplace", "note": "The Fourier transform of the weighted signal x(t) e^(-σt) is exactly what we will call the Laplace transform X(σ + jω)."}]}, {"n": 5, "cls": "HowItComesUp", "title": "How it comes up: LTI systems", "part": "How it comes up", "file": "05_HowItComesUp.mp4", "exists": true, "duration": 48.3, "beats": [{"t": 1.8, "label": "an LTI system", "note": "An LTI system is completely described by its impulse response h(t). The output is the convolution y(t) = integral of h(τ) x(t − τ) dτ."}, {"t": 5.5, "label": "weights h(tau) along the tau axis", "note": "Read h(τ) (red, on the side wall) as weights: how much the input from τ seconds ago still matters now."}, {"t": 9.5, "label": "delayed copies x(t - tau), scaled by h(tau)", "note": "Each lane is the input delayed by τ and scaled by h(τ)."}, {"t": 14.5, "label": "add them up: the output y(t)", "note": "Adding all the lanes gives the output y(t) in yellow. Convolution is a weighted sum of delayed copies of the input."}, {"t": 21.8, "label": "the input spiral", "note": "Now feed in a complex exponential e^(st), a spiral."}, {"t": 25.8, "label": "delay it by tau", "note": "Delay it by τ: the purple spiral e^(s(t − τ))."}, {"t": 31.8, "label": "same spiral, turned by omega*tau", "note": "The delayed spiral is exactly the original turned by ωτ and scaled by e^(-στ): e^(s(t − τ)) = e^(-sτ) e^(st). A delay is just multiplication by a complex number."}, {"t": 39.8, "label": "out comes the same spiral, times H(s)", "note": "So every delayed copy is a multiple of e^(st), and so is their weighted sum: y(t) = H(s) e^(st). The same spiral comes out, only rotated and scaled."}, {"t": 42.3, "label": "H(s): one complex number per s", "note": "H(s) = integral of h(τ) e^(-sτ) dτ is one complex number for each s. e^(st) is an eigenfunction of every LTI system and H(s) is its eigenvalue."}, {"t": 45.8, "label": "s = j omega: Fourier; any s: Laplace", "note": "On s = jω, H(jω) is the frequency response, the Fourier transform of h. For a general s it is the Laplace transform of h. That is how the Laplace transform comes up."}]}, {"n": 6, "cls": "LaplaceDefinition", "title": "What it is: the definition", "part": "What it is", "file": "06_LaplaceDefinition.mp4", "exists": true, "duration": 48.4, "beats": [{"t": 4.8, "label": "the definition", "note": "Definition: X(s) = integral from -∞ to ∞ of x(t) e^(-st) dt, with s = σ + jω. We write x(t) ↔ X(s)."}, {"t": 9.3, "label": "a Fourier transform of the weighted signal", "note": "Split e^(-st) = e^(-σt) e^(-jωt): X(σ + jω) is the Fourier transform of x(t) e^(-σt). For each σ, it is an ordinary Fourier transform of a weighted signal."}, {"t": 15.1, "label": "the signal grows: no Fourier transform", "note": "Take x(t) = e^(0.5t) u(t). It grows, so it has no Fourier transform."}, {"t": 20.1, "label": "one weighted copy per sigma", "note": "Each lane is x(t) e^(-σt) for one value of σ (the depth axis). Red lanes still grow, green lanes decay, and the grey one at σ = 0.5 is flat."}, {"t": 30.1, "label": "sweep sigma: the weight wins once sigma > 0.5", "note": "Sweep σ with the yellow slice: once σ > 0.5 the weight beats the growth and the weighted signal decays."}, {"t": 32.6, "label": "these sigmas: the region of convergence", "note": "Those values of σ form the region of convergence: σ > 0.5."}, {"t": 39.9, "label": "every omega works: a half-plane", "note": "On the s-plane ω makes no difference to convergence, so the ROC is the half-plane Re{s} > 0.5. Here X(s) = 1/(s - 0.5)."}, {"t": 42.4, "label": "Fourier = the j omega-axis, which is outside here", "note": "The jω-axis (where Fourier lives) is outside the ROC, so there is no Fourier transform, but the Laplace transform exists. That is Laplace's first advantage."}]}, {"n": 7, "cls": "SPlaneLandscape", "title": "Picturing X(s): the s-plane landscape", "part": "What it is", "file": "07_SPlaneLandscape.mp4", "exists": true, "duration": 50.3, "beats": [{"t": 2.8, "label": "each s gives a complex number X(s)", "note": "Example 9.1: x(t) = e^(-t) u(t), X(s) = 1/(s + 1). At each point s, X(s) is one complex number; for example X(0.5 + j) = 0.46 - 0.31j."}, {"t": 5.3, "label": "its size becomes a height", "note": "Plot its size |X(s)| as a height above that point."}, {"t": 11.3, "label": "the landscape |X(s)|", "note": "Do that for every s and you get a landscape over the s-plane."}, {"t": 13.8, "label": "a pole: X(s) blows up at s = -1", "note": "At s = -1 the denominator is zero and X blows up: a pole, drawn as a chimney that goes up forever (we cut it off)."}, {"t": 17.8, "label": "only the ROC part is the transform", "note": "The ROC Re{s} > -1 is where the integral converges, so only that part is the Laplace transform. The formula 1/(s + 1) continues past it (ghosted), but the integral does not."}, {"t": 25.3, "label": "slice along j omega: the Fourier transform", "note": "Slice along the jω-axis: |X(jω)| = 1/√(1 + ω²), the Fourier magnitude, projected on the back wall. The jω-axis is inside the ROC, so the Fourier transform exists."}, {"t": 37.8, "label": "zeros touch the floor, poles shoot up", "note": "Example 9.3: X(s) = (s - 1)/((s + 1)(s + 2)). Zeros (numerator = 0, drawn o) are where the landscape touches the floor; poles (denominator = 0, drawn x) shoot up."}, {"t": 48.8, "label": "seen from above: the pole-zero plot", "note": "Seen from above, the landscape becomes the pole-zero plot: the pole-zero plot is a map of this landscape."}]}, {"n": 8, "cls": "HowItsUsed", "title": "How it is used", "part": "How it is used", "file": "08_HowItsUsed.mp4", "exists": true, "duration": 66.2, "beats": [{"t": 13.3, "label": "velocity = s times position", "note": "The velocity of e^(st) is s times its position: d/dt e^(st) = s e^(st). The yellow arrow (velocity) is the blue arrow (position) turned by the angle of s and stretched by |s|."}, {"t": 15.8, "label": "so d/dt becomes multiplication by s", "note": "So differentiation becomes multiplication by s: dx/dt ↔ s X(s) (bilateral transform, Lecture 7)."}, {"t": 20.1, "label": "a mass-spring-damper style ODE", "note": "Take a second-order system, y'' + 2y' + 5y = x(t), the same shape as a mass-spring-damper."}, {"t": 22.1, "label": "every d/dt becomes a factor s", "note": "Transform both sides: every d/dt becomes a factor s, so s² Y + 2s Y + 5 Y = X. The differential equation is now algebra."}, {"t": 25.6, "label": "the system function and its poles", "note": "H(s) = Y/X = 1/(s² + 2s + 5), with poles at s = -1 ± 2j."}, {"t": 33.9, "label": "poles at -1 +- 2j: two spirals rise", "note": "Each pole p seeds a mode e^(pt), drawn as a spiral rising from the pole along a time axis. Left-half-plane poles give shrinking spirals."}, {"t": 37.4, "label": "together: a decaying oscillation h(t)", "note": "The two conjugate modes add up to the real impulse response h(t) = (1/2) e^(-t) sin 2t: a decaying oscillation."}, {"t": 41.9, "label": "closer to the j omega-axis: rings longer", "note": "Move the poles closer to the jω-axis: slower decay, the system rings longer (less damping)."}, {"t": 46.4, "label": "on the axis: sustained oscillation", "note": "On the jω-axis the oscillation never dies: marginally stable."}, {"t": 50.9, "label": "right half-plane: unstable", "note": "In the right half-plane the response grows without bound: unstable. A causal system is stable when all its poles are in the left half-plane."}, {"t": 53.4, "label": "Fourier fails here, Laplace doesn't", "note": "Now h(t) grows, so it has no Fourier transform, but the Laplace transform still exists with ROC Re{s} > 0.22. Laplace can analyse unstable systems."}, {"t": 63.7, "label": "the toolkit", "note": "Summary: convolution becomes multiplication, differential equations become algebra, pole positions tell you stability, feedback loops become simple algebra, and all of it works for growing signals."}]}, {"n": 9, "cls": "RightVsLeftSided", "title": "Examples 9.1 and 9.2: same X(s), different ROC", "part": "Examples", "file": "09_RightVsLeftSided.mp4", "exists": true, "duration": 54.9, "beats": [{"t": 5.8, "label": "the integrand spiral for t > 0", "note": "Example 9.1: x(t) = e^(-t) u(t). The integrand x(t) e^(-st) = e^(-(s+1)t) lives on t > 0. The test point s is in the inset."}, {"t": 15.8, "label": "across sigma = -1 it diverges", "note": "The integrand's envelope is e^(-(σ+1)t), which shrinks only if σ > -1. Move s across σ = -1 and the spiral grows: the integral diverges."}, {"t": 21.8, "label": "Example 9.1: 1/(s+1), ROC right of -1", "note": "So X(s) = 1/(s + 1) with ROC Re{s} > -1, to the right of the pole."}, {"t": 30.1, "label": "the integrand spiral for t < 0", "note": "Example 9.2: x(t) = -e^(-t) u(-t), which is non-zero only for t < 0. The integrand now lives on the negative time axis."}, {"t": 40.1, "label": "across sigma = -1 it diverges", "note": "Now it must shrink as t goes to -∞, which needs σ + 1 < 0. Crossing σ = -1 to the right makes it diverge."}, {"t": 46.1, "label": "Example 9.2: 1/(s+1), ROC left of -1", "note": "The result is X(s) = 1/(s + 1) again, but with ROC Re{s} < -1, to the left of the pole."}, {"t": 52.4, "label": "the ROC decides which signal you meant", "note": "Same algebraic X(s), different ROC, different signal. An X(s) without its ROC is an incomplete answer."}]}, {"n": 10, "cls": "LandscapeExamples", "title": "Examples 9.3, 9.4, 9.5", "part": "Examples", "file": "10_LandscapeExamples.mp4", "exists": true, "duration": 48.9, "beats": [{"t": 3.8, "label": "each term has its own half-plane", "note": "Example 9.3: x(t) = 3e^(-2t) u(t) - 2e^(-t) u(t). Each term has its own ROC: Re{s} > -2 and Re{s} > -1."}, {"t": 6.3, "label": "both must converge: Re{s} > -1", "note": "The sum converges only where both terms converge: the intersection Re{s} > -1. X(s) = (s - 1)/((s + 1)(s + 2))."}, {"t": 10.3, "label": "the landscape, ROC lit", "note": "The landscape with the ROC lit."}, {"t": 16.1, "label": "poles at -2 and -1 +- 3j", "note": "Example 9.4: e^(-2t) u(t) + e^(-t) cos(3t) u(t). By Euler, cos 3t gives two exponentials, so the poles are -2 and -1 ± 3j (a conjugate pair, as for any real signal). The zeros are at about -1.25 ± 2.11j."}, {"t": 27.1, "label": "the j omega slice: resonance peaks", "note": "The ROC Re{s} > -1 contains the jω-axis, so the Fourier transform exists. The slice along jω peaks near ω = ±3 because it passes close to the poles at -1 ± 3j: that is resonance."}, {"t": 36.9, "label": "double zero at 1, poles at -1 and 2", "note": "Example 9.5: δ(t) - (4/3) e^(-t) u(t) + (1/3) e^(2t) u(t). The transform of δ(t) is 1 for every s. X(s) = (s - 1)²/((s + 1)(s - 2)): poles at -1 and 2, a double zero at 1."}, {"t": 39.4, "label": "ROC Re{s} > 2: no Fourier transform", "note": "ROC = intersection = Re{s} > 2. The jω-axis is outside it: no Fourier transform, because the e^(2t) term grows."}, {"t": 46.9, "label": "far from the poles the delta leaves height 1", "note": "Far from the poles |X(s)| tends to 1: that constant is the δ(t) term."}]}, {"n": 11, "cls": "ROCProperties", "title": "ROC properties 1 to 5", "part": "The ROC", "file": "11_ROCProperties.mp4", "exists": true, "duration": 56.5, "beats": [{"t": 6.8, "label": "different omega, same envelope", "note": "Property 1: |x(t) e^(-(σ + jω)t)| = |x(t)| e^(-σt). Two test points with the same σ but different ω give different spirals with exactly the same envelope."}, {"t": 11.1, "label": "a whole vertical line converges together", "note": "So if one point on a vertical line converges, every point on that line does."}, {"t": 13.6, "label": "so the ROC is a union of vertical lines", "note": "The ROC is made of whole vertical lines: a vertical strip, a half-plane, or the whole plane."}, {"t": 19.9, "label": "poles bound the ROC", "note": "Property 2: at a pole X(s) is infinite, so the integral cannot converge there. Poles sit on ROC boundaries, never inside."}, {"t": 27.7, "label": "no spike at s = -1: the pole cancels", "note": "Property 3, Example 9.6: x(t) = e^(-t) on 0 < t < 2, X(s) = (1 - e^(-2(s+1)))/(s + 1). It looks like a pole at s = -1, but there 0/0 gives 2 (L'Hôpital): the landscape has height 2, no spike."}, {"t": 34.2, "label": "finite everywhere: big on the left, but never infinite", "note": "A finite-duration, absolutely integrable signal gives a finite integral for every s: the ROC is the entire s-plane. Instead of a pole there are zeros at s = -1 ± jπk. Big on the left, but never infinite."}, {"t": 40.5, "label": "the weight e^{-sigma t} over (t, sigma)", "note": "Properties 4 and 5 use the weight e^(-σt), drawn as a surface over (t, σ)."}, {"t": 46.5, "label": "right-sided: ROC extends to the right", "note": "Right-sided signal: only t > 0 matters. There, increasing σ only lowers the weight (green slice under grey). If σ₀ converges, every σ > σ₀ converges: the ROC extends to the right."}, {"t": 53.0, "label": "left-sided: ROC extends to the left", "note": "Left-sided signal: only t < 0 matters, and there decreasing σ lowers the weight. The ROC extends to the left."}]}, {"n": 12, "cls": "ROCStrips", "title": "ROC properties 6 to 8, Examples 9.7 and 9.8", "part": "The ROC", "file": "12_ROCStrips.mp4", "exists": true, "duration": 59.0, "beats": [{"t": 1.8, "label": "Example 9.7: a two-sided signal, split in two", "note": "Example 9.7: x(t) = e^(-b|t|) is two-sided. Split it into a right part e^(-bt) u(t) (blue) and a left part e^(bt) u(-t) (red)."}, {"t": 5.8, "label": "both ROCs overlap in a strip", "note": "Right part: ROC Re{s} > -b. Left part: ROC Re{s} < b. Both must converge, which leaves the strip -b < Re{s} < b (Property 6)."}, {"t": 10.3, "label": "the landscape, strip lit", "note": "X(s) = -2b/(s² - b²), with poles at ±b on the edges of the strip."}, {"t": 16.8, "label": "smaller b: a thinner strip", "note": "Make b smaller: the signal decays more slowly and the strip gets thinner."}, {"t": 21.8, "label": "b <= 0: the strip is gone", "note": "For b ≤ 0 the two half-planes no longer overlap: no ROC, so no Laplace transform at all."}, {"t": 26.1, "label": "poles chop the plane into strips", "note": "Properties 7 and 8 (rational X(s)): ROC edges pass through poles, so the poles chop the plane into vertical strips."}, {"t": 36.7, "label": "the allowed ROCs", "note": "Right-sided: right of the rightmost pole. Left-sided: left of the leftmost pole. Two-sided: a strip between two poles."}, {"t": 42.5, "label": "two poles: -1 and -2", "note": "Example 9.8: X(s) = 1/((s + 1)(s + 2)), poles at -1 and -2, so there are three possible ROCs."}, {"t": 46.5, "label": "right of both poles: right-sided", "note": "Re{s} > -1 gives the right-sided signal x(t) = (e^(-t) - e^(-2t)) u(t)."}, {"t": 50.0, "label": "left of both poles: left-sided", "note": "Re{s} < -2 gives the left-sided signal x(t) = (-e^(-t) + e^(-2t)) u(-t)."}, {"t": 53.5, "label": "between the poles: two-sided", "note": "-2 < Re{s} < -1 gives the two-sided signal x(t) = -e^(-t) u(-t) - e^(-2t) u(t)."}, {"t": 57.0, "label": "the ROC picks the signal", "note": "One X(s), three signals: the ROC picks the signal. How do we compute them? That is the inverse transform."}]}, {"n": 13, "cls": "InverseLaplace", "title": "The inverse Laplace transform", "part": "Inverse transform", "file": "13_InverseLaplace.mp4", "exists": true, "duration": 68.416667, "beats": [{"t": 1.8, "label": "start from the Fourier view", "note": "Start from X(σ + jω) = Fourier transform of x(t) e^(-σt)."}, {"t": 3.8, "label": "invert the Fourier transform", "note": "Undo the Fourier transform: x(t) e^(-σt) = 1/(2π) times the integral of X(σ + jω) e^(jωt) dω."}, {"t": 5.8, "label": "multiply by e^{sigma t}", "note": "Multiply both sides by e^(σt): x(t) = 1/(2π) times the integral of X(σ + jω) e^((σ + jω)t) dω."}, {"t": 7.8, "label": "the Bromwich integral", "note": "Substitute s = σ + jω (σ fixed, ds = j dω): x(t) = 1/(2πj) times the integral of X(s) e^(st) ds from σ - j∞ to σ + j∞. This is the Bromwich integral; σ can be anywhere inside the ROC."}, {"t": 16.1, "label": "the values of X(s) along the line", "note": "Geometrically: walk up the vertical line Re{s} = σ inside the ROC, reading off X(s) along the way (the yellow curve on the landscape)."}, {"t": 18.6, "label": "each point contributes X(s) e^{st}", "note": "Each point s on the line contributes X(s) e^(st): a spiral weighted by X(s)."}, {"t": 26.45, "label": "each wave grows like e^{sigma t}...", "note": "Numerically, as a Riemann sum: add waves at ω = kΔω. With σ = 0.3 every one of them grows like e^(0.3t)..."}, {"t": 33.617, "label": "...yet together they rebuild e^{-t}u(t)", "note": "...yet together they rebuild the decaying e^(-t) u(t): the growing parts cancel."}, {"t": 37.117, "label": "in the limit: exactly x(t)", "note": "With all frequencies (the integral) we get exactly x(t), including the value 0.5 at the jump (the midpoint)."}, {"t": 46.417, "label": "line right of the pole: e^{-t}u(t)", "note": "With the line to the right of the pole (σ = 0.3) the result is e^(-t) u(t)."}, {"t": 54.117, "label": "left of the pole: -e^{-t}u(-t)", "note": "Slide the same line to the left of the pole (σ = -1.5): the very same X(s) now gives -e^(-t) u(-t). The line has to lie in the ROC, and a different ROC gives a different signal."}, {"t": 60.417, "label": "t > 0: enclose the pole", "note": "In practice the line is closed with a large semicircle. For t > 0 close to the left: the contour encloses the pole, and its residue gives e^(-t)."}, {"t": 63.917, "label": "t < 0: enclose nothing", "note": "For t < 0 close to the right: nothing is inside, so x(t) = 0. That is why the result is right-sided."}, {"t": 66.417, "label": "the residue theorem does the integral", "note": "The Cauchy residue theorem evaluates the integral (beyond this course; the slides link a video). For rational X(s) we use partial fractions instead."}]}, {"n": 14, "cls": "PartialFractions", "title": "Partial fractions, Examples 9.9 to 9.11", "part": "Inverse transform", "file": "14_PartialFractions.mp4", "exists": true, "duration": 44.4, "beats": [{"t": 1.8, "label": "split into simple terms", "note": "For a rational X(s), split it into simple terms: 1/((s + 1)(s + 2)) = A/(s + 1) + B/(s + 2)."}, {"t": 4.8, "label": "cover-up: A = 1, B = -1", "note": "Cover-up method: A = (s + 1) X(s) at s = -1, which is 1; B = (s + 2) X(s) at s = -2, which is -1."}, {"t": 7.3, "label": "the expansion is always the same", "note": "So X(s) = 1/(s + 1) - 1/(s + 2), whatever the ROC."}, {"t": 12.6, "label": "which side of the pole is the ROC on?", "note": "Each term A/(s + a) has two possible inverses: if the ROC is to the right of its pole, A e^(-at) u(t); if to the left, -A e^(-at) u(-t)."}, {"t": 23.4, "label": "Example 9.9: Re s > -1", "note": "Example 9.9, ROC Re{s} > -1: right of both poles, so both terms are causal: x(t) = (e^(-t) - e^(-2t)) u(t)."}, {"t": 29.4, "label": "Example 9.10: Re s < -2", "note": "Example 9.10, ROC Re{s} < -2: left of both poles, so both terms are anticausal: x(t) = (-e^(-t) + e^(-2t)) u(-t)."}, {"t": 35.4, "label": "Example 9.11: -2 < Re s < -1", "note": "Example 9.11, -2 < Re{s} < -1: the ROC is right of -2 (causal term) but left of -1 (anticausal term): x(t) = -e^(-t) u(-t) - e^(-2t) u(t)."}, {"t": 41.9, "label": "partial fractions + ROC = inverse transform", "note": "Recipe: expand in partial fractions, check which side of each pole the ROC is on, invert each term, add them up."}]}];
const HOLD = 0.35;
const v = document.getElementById('v');
const $ = (id) => document.getElementById(id);
let si = 0, bi = -1, target = null, idle = null;

function scene() { return DATA[si]; }

function load(i, then) {
  si = Math.max(0, Math.min(DATA.length - 1, i));
  bi = -1; target = null;
  const s = scene();
  $('missing').style.display = s.exists ? 'none' : 'block';
  $('missing').textContent = s.exists ? '' : 'videos/' + s.file + ' is missing - run ./render_all.sh';
  v.src = 'videos/' + s.file;
  v.pause();
  v.addEventListener('loadeddata', () => { if (then) then(); render(); }, { once: true });
  try { history.replaceState(null, '', '#' + si); } catch (e) {}
  render();
}

function seekBeat(k) {             // show the held frame of beat k (k = -1: the start)
  v.pause(); target = null; bi = k;
  v.currentTime = k < 0 ? 0 : scene().beats[k].t + HOLD;
  render();
}

function next() {
  const beats = scene().beats;
  if (!v.paused && target !== null) {          // already playing towards a pause: jump there
    seekBeat(bi + 1); return;
  }
  if (bi + 1 < beats.length) {
    target = beats[bi + 1].t + HOLD;
    v.play();
  } else if (!v.ended && v.currentTime < v.duration - 0.05) {
    target = null; v.play();                   // play out the end of the scene
  } else if (si + 1 < DATA.length) {
    load(si + 1, () => next());
  }
  render();
}

function prev() {
  if (bi >= 0) { seekBeat(bi - 1); return; }
  if (si > 0) load(si - 1, () => seekBeat(DATA[si].beats.length - 1));
}

function tick() {
  if (!v.paused && target !== null && v.currentTime >= target) {
    v.pause(); v.currentTime = target; target = null; bi += 1; render();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
v.addEventListener('ended', render);
v.addEventListener('play', render);
v.addEventListener('pause', render);

function fmt(t) { return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); }

function render() {
  const s = scene();
  const n = s.beats.length;
  let state;
  if (!v.paused) state = '&#9654; playing';
  else if (v.ended || (bi === n - 1 && v.currentTime >= v.duration - 0.05)) state = 'end of scene &middot; Space for the next';
  else if (bi < 0) state = 'ready &middot; Space to play';
  else state = 'pause ' + (bi + 1) + '/' + n + ': ' + escapeHtml(s.beats[bi].label);
  $('where').innerHTML = '<b>' + String(s.n).padStart(2, '0') + ' &middot; ' + escapeHtml(s.title) + '</b> <span>&mdash; ' + state + '</span>';
  const cur = bi >= 0 ? s.beats[bi] : null;
  const up = s.beats[bi + 1];
  $('notes').querySelector('.label').textContent = cur ? cur.label : s.title;
  $('notes').querySelector('.text').textContent = cur ? cur.note : 'Scene ' + s.n + ' of ' + (DATA.length - 1) + ' (' + s.part + ').';
  $('notes').querySelector('.next').textContent = up ? 'Next pause: ' + up.label : (si + 1 < DATA.length ? 'Next scene: ' + DATA[si + 1].title : 'Last scene');
  document.querySelectorAll('.scene').forEach((el, i) => el.classList.toggle('cur', i === si));
  document.querySelectorAll('.beat').forEach((el) => el.classList.toggle('cur', +el.dataset.s === si && +el.dataset.b === bi));
}

function escapeHtml(t) { return t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function buildList() {
  const nav = $('list');
  let part = null, h = '';
  DATA.forEach((s, i) => {
    if (s.part !== part) { part = s.part; h += '<h2>' + escapeHtml(part) + '</h2>'; }
    h += '<div class="scene" data-s="' + i + '"><div class="st">' + String(s.n).padStart(2, '0') + ' &middot; ' + escapeHtml(s.title) +
         '</div><div class="meta">' + fmt(s.duration) + ' &middot; ' + s.beats.length + ' pauses</div>';
    s.beats.forEach((b, k) => { h += '<div class="beat" data-s="' + i + '" data-b="' + k + '">' + fmt(b.t) + ' &nbsp;' + escapeHtml(b.label) + '</div>'; });
    h += '</div>';
  });
  nav.innerHTML = h;
  nav.addEventListener('click', (e) => {
    const b = e.target.closest('.beat'), sc = e.target.closest('.scene');
    if (b) { const i = +b.dataset.s, k = +b.dataset.b; if (i === si) seekBeat(k); else load(i, () => seekBeat(k)); }
    else if (sc) load(+sc.dataset.s);
    nav.classList.remove('open');
  });
}

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
}

function wake() {
  $('bar').classList.remove('hide');
  clearTimeout(idle);
  idle = setTimeout(() => $('bar').classList.add('hide'), 2500);
}

document.addEventListener('mousemove', wake);
document.addEventListener('keydown', (e) => {
  if ($('hint').classList.contains('show')) { $('hint').classList.remove('show'); e.preventDefault(); return; }
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown') next();
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') prev();
  else if (k === ']') load(si + 1);
  else if (k === '[') load(si - 1);
  else if (k === 'Home') seekBeat(-1);
  else if (k === 'n' || k === 'N') $('notes').classList.toggle('show');
  else if (k === 'l' || k === 'L') $('list').classList.toggle('open');
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'b' || k === 'B' || k === '.') $('black').classList.toggle('on');
  else if (k === '?' || k === 'h' || k === 'H') $('hint').classList.add('show');
  else if (k === 'Escape') { $('list').classList.remove('open'); $('black').classList.remove('on'); }
  else return;
  e.preventDefault();
});
v.addEventListener('click', next);
$('bNext').onclick = next;
$('bPrev').onclick = prev;
$('bList').onclick = () => $('list').classList.toggle('open');
$('bNotes').onclick = () => $('notes').classList.toggle('show');
$('bFull').onclick = toggleFull;
$('bHelp').onclick = () => $('hint').classList.add('show');

buildList();
const start = parseInt(location.hash.slice(1), 10);
load(Number.isFinite(start) ? start : 0);
wake();
</script>
