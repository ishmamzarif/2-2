<script>
(() => {
'use strict';

/* ============================================================== complex numbers */
const C = (re, im = 0) => ({ re, im });
const cadd = (a, b) => C(a.re + b.re, a.im + b.im);
const csub = (a, b) => C(a.re - b.re, a.im - b.im);
const cmul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
const cexp = (a) => { const m = Math.exp(a.re); return C(m * Math.cos(a.im), m * Math.sin(a.im)); };
const cabs = (a) => Math.hypot(a.re, a.im);
const cscale = (a, k) => C(a.re * k, a.im * k);
const conj = (a) => C(a.re, -a.im);
const fmt = (x, d = 2) => (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d);
const fmtC = (z, d = 2) => fmt(z.re, d) + (z.im < 0 ? ' − ' : ' + ') + fmt(Math.abs(z.im), d) + 'j';
function rational(k, zeros, poles) {
  return (s) => {
    let n = C(k, 0), d = C(1, 0);
    for (const z of zeros) n = cmul(n, csub(s, z));
    for (const p of poles) d = cmul(d, csub(s, p));
    return cdiv(n, d);
  };
}

/* ============================================================== palette */
const COL = { sig: 0x58c4dd, teal: 0x5cd0b3, gold: 0xf0ac5f, yellow: 0xf7d96f, purple: 0xb189c6, pole: 0xff8080, zero: 0xa6cf8c,
              roc: 0x29abca, good: 0x83c167, bad: 0xfc6255, axis: 0x9da0b0, grid: 0x245a70, wall: 0x2a2c36, red: 0xfc6255, white: 0xe8e9ef };
const CSS = { sig: '#58c4dd', teal: '#5cd0b3', gold: '#f0ac5f', yellow: '#f7d96f', purple: '#b189c6', pole: '#ff8080', zero: '#a6cf8c',
              roc: '#29abca', good: '#83c167', bad: '#fc6255', fg: '#e8e9ef', muted: '#a3a6b5', faint: '#6f7383', line: '#282b36', grid: '#1d2a33' };
const HEIGHT_STOPS = [[0, 0x236b8e], [0.2, 0x58c4dd], [0.43, 0x5cd0b3], [0.73, 0xf7d96f], [1, 0xfc6255]];
function heightColor(x, out) {
  x = Math.max(0, Math.min(1, x));
  for (let i = 1; i < HEIGHT_STOPS.length; i++) {
    const [x1, c1] = HEIGHT_STOPS[i];
    if (x <= x1) {
      const [x0, c0] = HEIGHT_STOPS[i - 1];
      const f = (x - x0) / (x1 - x0);
      out.setHex(c0).lerp(new THREE.Color(c1), f);
      return out;
    }
  }
  return out.setHex(HEIGHT_STOPS[HEIGHT_STOPS.length - 1][1]);
}

/* ============================================================== DOM helpers */
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function tex(src, display = false) {
  const s = el('span');
  if (window.katex) katex.render(src, s, { throwOnError: false, displayMode: display });
  else s.textContent = src;
  return s;
}
function setTex(node, src, display = false) {
  if (window.katex) katex.render(src, node, { throwOnError: false, displayMode: display });
  else node.textContent = src;
}
function slider({ label, min, max, step, value, unit = '', format, onInput }) {
  const id = 'sl-' + Math.random().toString(36).slice(2, 8);
  const v = el('span', { class: 'val' });
  const input = el('input', { type: 'range', id, min, max, step, value });
  const show = () => { v.textContent = (format ? format(+input.value) : (+input.value).toFixed(2)) + unit; };
  input.addEventListener('input', () => { show(); onInput(+input.value); });
  show();
  const wrap = el('div', { class: 'ctl' }, el('div', { class: 'row' }, el('label', { for: id }, label), v), input);
  return { el: wrap, input, set(x) { input.value = x; show(); } };
}
function seg(options, value, onChange) {
  const box = el('div', { class: 'seg', role: 'group' });
  const btns = options.map(([id, label]) => {
    const b = el('button', { type: 'button', 'aria-pressed': String(id === value) });
    if (label.startsWith('$')) b.append(tex(label.slice(1, -1))); else b.textContent = label;
    b.addEventListener('click', () => { set(id); onChange(id); });
    box.append(b);
    return [id, b];
  });
  function set(id) { for (const [k, b] of btns) b.setAttribute('aria-pressed', String(k === id)); }
  return { el: box, set };
}
function check(label, checked, onChange) {
  const id = 'ck-' + Math.random().toString(36).slice(2, 8);
  const input = el('input', { type: 'checkbox', id });
  input.checked = checked;
  input.addEventListener('change', () => onChange(input.checked));
  const l = el('label', { class: 'chk', for: id }, input);
  if (label.includes('$')) {
    for (const [i, part] of label.split('$').entries()) l.append(i % 2 ? tex(part) : document.createTextNode(part));
  } else l.append(label);
  return { el: l, input };
}
function readout(rows) {
  const dl = el('dl', { class: 'readout' });
  const cells = {};
  for (const [key, label] of rows) {
    const dd = el('dd');
    dl.append(el('dt', {}, label), dd);
    cells[key] = dd;
  }
  return { el: dl, cells };
}
function verdict(node, kind, text) {
  node.innerHTML = '';
  node.append(el('span', { class: 'verdict ' + kind }, text));
}

/* ============================================================== 2D canvases: s-plane pad and plots */
class Canvas2D {
  constructor(cls) {
    this.el = el('canvas', { class: cls });
    this.ctx = this.el.getContext('2d');
    this.dpr = 1;
    new ResizeObserver(() => this.resize()).observe(this.el);
  }
  resize() {
    const r = this.el.getBoundingClientRect();
    if (r.width < 2) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.el.width = Math.round(r.width * this.dpr);
    this.el.height = Math.round(r.height * this.dpr);
    this.w = r.width; this.h = r.height;
    this.draw();
  }
  draw() {}
}

class SPad extends Canvas2D {
  /* the s-plane: draggable handles, regions, poles/zeros, vertical lines */
  constructor({ xr = [-3, 3], yr = [-3, 3], height = 230, onDrag, onClick }) {
    super('pad');
    this.el.style.height = height + 'px';
    Object.assign(this, { xr, yr, onDrag, onClick });
    this.handles = []; this.regions = []; this.vlines = []; this.poles = []; this.zeros = []; this.marks = []; this.stripes = [];
    this.drag = null;
    this.el.addEventListener('pointerdown', (e) => this.down(e));
    this.el.addEventListener('pointermove', (e) => this.move(e));
    this.el.addEventListener('pointerup', (e) => this.up(e));
    this.el.addEventListener('pointercancel', (e) => this.up(e));
  }
  pad() { return { l: 30, r: 14, t: 12, b: 22 }; }
  X(x) { const p = this.pad(); return p.l + (x - this.xr[0]) / (this.xr[1] - this.xr[0]) * (this.w - p.l - p.r); }
  Y(y) { const p = this.pad(); return p.t + (this.yr[1] - y) / (this.yr[1] - this.yr[0]) * (this.h - p.t - p.b); }
  inv(px, py) {
    const p = this.pad();
    return [this.xr[0] + (px - p.l) / (this.w - p.l - p.r) * (this.xr[1] - this.xr[0]),
            this.yr[1] - (py - p.t) / (this.h - p.t - p.b) * (this.yr[1] - this.yr[0])];
  }
  draw() {
    const c = this.ctx; if (!this.w) return;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.clearRect(0, 0, this.w, this.h);
    const [x0, x1] = this.xr, [y0, y1] = this.yr;
    // regions
    for (const r of this.regions) {
      const l = Math.max(x0, r.l ?? x0), rr = Math.min(x1, r.r ?? x1);
      if (rr <= l) continue;
      c.fillStyle = r.color; c.globalAlpha = r.alpha ?? 0.25;
      c.fillRect(this.X(l), this.Y(y1), this.X(rr) - this.X(l), this.Y(y0) - this.Y(y1));
      c.globalAlpha = 1;
      if (r.edges !== false) {
        c.strokeStyle = r.color; c.setLineDash([5, 4]); c.lineWidth = 1.5;
        for (const e of [r.l, r.r]) if (e != null && e > x0 && e < x1) { c.beginPath(); c.moveTo(this.X(e), this.Y(y1)); c.lineTo(this.X(e), this.Y(y0)); c.stroke(); }
        c.setLineDash([]);
      }
      if (r.label) { c.fillStyle = r.color; c.font = '600 11px ' + getComputedStyle(document.body).fontFamily; c.textAlign = 'center';
        c.fillText(r.label, (this.X(l) + this.X(rr)) / 2, this.Y(y0) - 6); }
    }
    for (const s of this.stripes) {
      c.fillStyle = s.color; c.globalAlpha = 0.55;
      c.fillRect(this.X(s.x) - 1.5, this.Y(y1), 3, this.Y(y0) - this.Y(y1));
      c.globalAlpha = 1;
    }
    // grid
    c.strokeStyle = CSS.grid; c.lineWidth = 1;
    const sx = niceStep(x1 - x0), sy = niceStep(y1 - y0);
    c.beginPath();
    for (let x = Math.ceil(x0 / sx) * sx; x <= x1 + 1e-9; x += sx) { c.moveTo(this.X(x), this.Y(y0)); c.lineTo(this.X(x), this.Y(y1)); }
    for (let y = Math.ceil(y0 / sy) * sy; y <= y1 + 1e-9; y += sy) { c.moveTo(this.X(x0), this.Y(y)); c.lineTo(this.X(x1), this.Y(y)); }
    c.stroke();
    // axes
    c.strokeStyle = '#8a8d9c'; c.lineWidth = 1.2; c.beginPath();
    if (y0 <= 0 && y1 >= 0) { c.moveTo(this.X(x0), this.Y(0)); c.lineTo(this.X(x1), this.Y(0)); }
    if (x0 <= 0 && x1 >= 0) { c.moveTo(this.X(0), this.Y(y0)); c.lineTo(this.X(0), this.Y(y1)); }
    c.stroke();
    c.fillStyle = CSS.faint; c.font = '11px ' + getComputedStyle(document.body).fontFamily; c.textAlign = 'center';
    for (let x = Math.ceil(x0 / sx) * sx; x <= x1 + 1e-9; x += sx) if (Math.abs(x) > 1e-9) c.fillText(+x.toFixed(2), this.X(x), this.h - 7);
    c.textAlign = 'right';
    for (let y = Math.ceil(y0 / sy) * sy; y <= y1 + 1e-9; y += sy) if (Math.abs(y) > 1e-9) c.fillText(+y.toFixed(2) + 'j', 26, this.Y(y) + 4);
    c.fillStyle = CSS.muted; c.font = 'italic 13px KaTeX_Main, serif'; c.textAlign = 'left';
    c.fillText('σ', this.w - 12, this.Y(Math.max(y0, Math.min(y1, 0))) - 5);
    c.fillText('jω', this.X(Math.max(x0, Math.min(x1, 0))) + 5, 14);
    // vertical lines
    for (const v of this.vlines) {
      c.strokeStyle = v.color; c.lineWidth = v.width ?? 3; c.setLineDash(v.dash ?? []);
      c.beginPath(); c.moveTo(this.X(v.x), this.Y(y0)); c.lineTo(this.X(v.x), this.Y(y1)); c.stroke(); c.setLineDash([]);
    }
    // marks (arrows etc.)
    for (const m of this.marks) m(c, this);
    // zeros and poles
    for (const z of this.zeros) { c.strokeStyle = z.color || CSS.zero; c.lineWidth = 2.2; c.beginPath(); c.arc(this.X(z.re), this.Y(z.im), z.r || 6, 0, 2 * Math.PI); c.stroke(); }
    for (const p of this.poles) {
      const X = this.X(p.re), Y = this.Y(p.im), s = 6;
      c.strokeStyle = p.color || CSS.pole; c.lineWidth = 2.6;
      c.beginPath(); c.moveTo(X - s, Y - s); c.lineTo(X + s, Y + s); c.moveTo(X + s, Y - s); c.lineTo(X - s, Y + s); c.stroke();
    }
    // handles
    for (const h of this.handles) {
      if (h.hidden) continue;
      const X = this.X(h.x), Y = this.Y(h.y);
      c.fillStyle = h.color; c.strokeStyle = '#0c0c0f'; c.lineWidth = 2;
      c.beginPath(); c.arc(X, Y, h === this.drag ? 8 : 7, 0, 2 * Math.PI); c.fill(); c.stroke();
      if (h.label) { c.fillStyle = h.color; c.font = 'italic 14px KaTeX_Main, serif'; c.textAlign = 'left'; c.fillText(h.label, X + 9, Y - 8); }
    }
  }
  pick(e) {
    const r = this.el.getBoundingClientRect(); const px = e.clientX - r.left, py = e.clientY - r.top;
    let best = null, bd = 16;
    for (const h of this.handles) {
      if (h.hidden) continue;
      const d = Math.hypot(this.X(h.x) - px, this.Y(h.y) - py);

  for (let u = Math.ceil(u0 / step) * step; u <= u1 + 1e-9; u += step) lines.push([V(u, 0, -v0), V(u, 0, -v1)]);
  for (let v = Math.ceil(v0 / step) * step; v <= v1 + 1e-9; v += step) lines.push([V(u0, 0, -v), V(u1, 0, -v)]);
  scene.add(segments(lines, COL.grid, 0.55));
  scene.add(rod(V(u0, 0, 0), V(u1 + 0.3, 0, 0), COL.axis, 0.016));
  scene.add(rod(V(0, 0, -v0), V(0, 0, -v1 - 0.3), COL.axis, 0.016));
  if (labelsOn) {
    labels.add('\\sigma', V(u1 + 0.65, 0, 0), 'lg', CSS.muted);
    labels.add('j\\omega', V(0, 0, -v1 - 0.75), 'lg', CSS.muted);
    for (let u = Math.ceil(u0); u <= u1; u++) if (u) labels.add(String(u), V(u, 0, 0.35), 'sm', CSS.faint);
    for (let v = Math.ceil(v0); v <= v1; v++) if (v && v % 2 === 0) labels.add(v + 'j', V(-0.35, 0, -v), 'sm', CSS.faint);
  }
  return { P };
}
function floorBand(l, r, v0, v1, color, opacity = 0.28, y = 0.002) {
  const g = new THREE.Group();
  g.add(quad(V(l, y, -v0), V(r, y, -v0), V(r, y, -v1), V(l, y, -v1), color, opacity));
  return g;
}
function floorEdge(x, v0, v1, color) { return thinLine([V(x, 0.004, -v0), V(x, 0.004, -v1)], color, 1, true); }

/* ---------------------------------------------------------- 2. e^{st} */
stop({ id: 'est', name: 'e^{st}', build() {
  const scene = makeScene(), labels = new Labels();
  const T1 = 8, R = 2;

  const { P } = ct;

  scene.add(spiral.group, mirror.group, real.group);

  const funnelWire = new THREE.MeshBasicMaterial({ color: COL.pole, wireframe: true, transparent: true, opacity: 0.18 });
  let funnel = null;
  const lS = labels.add('e^{st}', () => P(T1 + 0.3, C(0, 1.5)), 'lg', CSS.sig);

  function curve(s) {
    const pts = [];
    for (let i = 0; i <= 700; i++) { const t = T1 * i / 700; const z = cexp(cmul(s, C(t))); pts.push(cabs(z) <= R ? P(t, z) : null); }

  }

    spiral.set(curve(st.s));

    if (st.pair) {
      const pts = [];

      real.set(pts);
    } else real.set([]);
    if (funnel) { scene.remove(funnel); funnel.children.forEach((m) => m.geometry.dispose()); }
    funnel = null;
    if (st.env) {
      const s = st.s.re; let hi = T1; if (s > 1e-6) hi = Math.min(T1, Math.log(R) / s);
      const nu = 40, nv = 28, ps = [], idx = [];
      for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) {
        const t = hi * i / nu, a = 2 * Math.PI * j / nv, r = Math.exp(s * t);
        ps.push(P(t, C(r * Math.cos(a), r * Math.sin(a))));
      }
      for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) { const a = i * (nv + 1) + j, b = a + nv + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
      const g = new THREE.BufferGeometry().setFromPoints(ps); g.setIndex(idx);
      funnel = new THREE.Group(); funnel.add(new THREE.Mesh(g, funnelMat), new THREE.Mesh(g, funnelWire)); scene.add(funnel);
    }
    const s = st.s;

    else if (s.re < 0) { kind = 'good'; text = Math.abs(s.im) < 0.05 ? 'decays, no spin' : 'spirals in (decays)'; }
    else { kind = 'bad'; text = Math.abs(s.im) < 0.05 ? 'grows, no spin' : 'spirals out (grows)'; }
    verdict(ro.cells.b, kind, text);
    pad.handles[0].x = s.re; pad.handles[0].y = s.im; pad.handles[1].x = s.re; pad.handles[1].y = -s.im; pad.handles[1].hidden = !st.pair;
    pad.draw();
  }
  const sec = panelSection('The complex exponential', 'Drag the point s. The real part σ sets the size, growing or decaying; the imaginary part ω sets the spin.',
    'e^{st} = e^{\\sigma t}\\, e^{j\\omega t}');
  const pad = new SPad({ xr: [-1, 1], yr: [-4, 4], height: 250, onDrag: (h) => { st.s = h.id === 'c' ? C(h.x, -h.y) : C(h.x, h.y); rebuild(); } });
  pad.regions = [{ l: null, r: 0, color: CSS.good, alpha: 0.13, edges: false, label: 'decay' }, { l: 0, r: null, color: CSS.bad, alpha: 0.13, edges: false, label: 'growth' }];
  pad.vlines = [{ x: 0, color: CSS.yellow, width: 2 }];
  pad.handles = [{ id: 's', x: st.s.re, y: st.s.im, color: CSS.yellow, label: 's' }, { id: 'c', x: st.s.re, y: -st.s.im, color: CSS.purple, label: 's*', hidden: true }];
  const presets = seg([['d', 'Decay'], ['o', 'Pure spin'], ['g', 'Growth'], ['r', 'No spin']], 'd', (id) => {
    st.s = { d: C(-0.25, 2), o: C(0, 2), g: C(0.1, 2), r: C(-0.3, 0) }[id]; rebuild();
  });

  const c2 = check('Conjugate pair, real sum', false, (v) => { st.pair = v; rebuild(); });
  const ro = readout([['s', 'point'], ['b', 'behaviour']]);

    el('div', { class: 'chks' }, c1.el, c2.el), ro.el,
    notes(['Left half-plane: the funnel narrows, the spiral dies out. Right half-plane: it blows up.',
           'On the $j\\omega$-axis the spiral neither grows nor decays: these are the Fourier building blocks.',

stop({ id: 'convergence', name: 'Convergence', build() {
  const scene = makeScene(), labels = new Labels();
  const T1 = 10, R = 1.6;
  const ct = complexTime(scene, labels, { t0: 0, t1: T1, R, k: 1.1 });
  const { P } = ct;

  scene.add(integrand.group, total.group, limit.group);

  const lT = labels.add('\\int_0^T e^{-st}dt', () => P(T1 + 0.3, C(-1.5, 0.9)), '', CSS.yellow);
  const lL = labels.add('1/s', () => { const v = cdiv(C(1), st.s); return cabs(v) < R ? P(T1 + 0.5, v) : null; }, 'lg', CSS.good);
  const I = (t) => cdiv(csub(C(1), cexp(cscale(st.s, -t))), st.s);

  view.draw = function () {

    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, this.w, this.h);
    const sc = Math.min(this.w, this.h) / 4.4, cx = this.w / 2, cy = this.h / 2;
    const X = (z) => cx + z.re * sc, Y = (z) => cy - z.im * sc;
    c.strokeStyle = CSS.grid; c.lineWidth = 1; c.beginPath();
    for (let k = -2; k <= 2; k++) { c.moveTo(cx + k * sc, 0); c.lineTo(cx + k * sc, this.h); c.moveTo(0, cy + k * sc); c.lineTo(this.w, cy + k * sc); }
    c.stroke();
    c.strokeStyle = '#8a8d9c'; c.beginPath(); c.moveTo(0, cy); c.lineTo(this.w, cy); c.moveTo(cx, 0); c.lineTo(cx, this.h); c.stroke();
    c.fillStyle = CSS.faint; c.font = '11px ' + getComputedStyle(document.body).fontFamily; c.fillText('Re', this.w - 22, cy - 6); c.fillText('Im', cx + 6, 13);
    c.strokeStyle = CSS.yellow; c.lineWidth = 2.4; c.beginPath(); let pen = false;
    const n = Math.max(2, Math.round(st.T * 80));
    for (let i = 0; i <= n; i++) { const z = I(st.T * i / n); const x = X(z), y = Y(z);
      if (Math.abs(z.re) > 2.4 || Math.abs(z.im) > 2.4) { pen = false; continue; }
      if (!pen) { c.moveTo(x, y); pen = true; } else c.lineTo(x, y); }
    c.stroke();
    const target = cdiv(C(1), st.s);
    if (st.s.re > 0 && cabs(target) < 2.3) { c.fillStyle = CSS.good; c.beginPath(); c.arc(X(target), Y(target), 5, 0, 2 * Math.PI); c.fill();
      c.font = 'italic 14px KaTeX_Main, serif'; c.fillText('1/s', X(target) + 8, Y(target) - 6); }
    const z = I(st.T), g = cscale(cexp(cscale(st.s, -st.T)), 0.6);
    if (Math.abs(z.re) < 2.4 && Math.abs(z.im) < 2.4) {
      c.strokeStyle = CSS.sig; c.lineWidth = 2.5; c.beginPath(); c.moveTo(X(z), Y(z)); c.lineTo(X(cadd(z, g)), Y(cadd(z, g))); c.stroke();
      c.fillStyle = CSS.yellow; c.beginPath(); c.arc(X(z), Y(z), 4, 0, 2 * Math.PI); c.fill();
    }

  sec.append(el('div', { class: 'lab' }, 's-plane'), pad.el, el('div', { class: 'lab' }, 'Looking down the time axis'), view.el, replay, ro.el,

           'At $\\sigma = 0$ the total runs round a circle forever; for $\\sigma < 0$ it spirals out.']));
  return { scene, labels, panel: sec, view: { target: [0.8, 0, 0], r: 17, theta: 0.75, phi: 1.1 },

const PRESETS = {
  ex91: { name: '9.1', k: 1, zeros: [], poles: [C(-1)], roc: [-1, null], tex: 'X(s)=\\dfrac{1}{s+1}', sig: 'e^{-t}u(t)' },
  ex92: { name: '9.2', k: 1, zeros: [], poles: [C(-1)], roc: [null, -1], tex: 'X(s)=\\dfrac{1}{s+1}', sig: '-e^{-t}u(-t)' },
  ex93: { name: '9.3', k: 1, zeros: [C(1)], poles: [C(-1), C(-2)], roc: [-1, null], tex: 'X(s)=\\dfrac{s-1}{(s+1)(s+2)}', sig: '3e^{-2t}u(t)-2e^{-t}u(t)' },
  ex94: { name: '9.4', k: 2, zeros: [C(-1.25, 2.107), C(-1.25, -2.107)], poles: [C(-2), C(-1, 3), C(-1, -3)], roc: [-1, null],
          tex: 'X(s)=\\dfrac{2s^2+5s+12}{(s+2)(s^2+2s+10)}', sig: 'e^{-2t}u(t)+e^{-t}\\cos(3t)u(t)' },
  ex95: { name: '9.5', k: 1, zeros: [C(1), C(1)], poles: [C(-1), C(2)], roc: [2, null], tex: 'X(s)=\\dfrac{(s-1)^2}{(s+1)(s-2)}', sig: '\\delta(t)-\\tfrac43e^{-t}u(t)+\\tfrac13e^{2t}u(t)' },
  ex96: { name: '9.6', F: (s) => { const a = cadd(s, C(1)); if (cabs(a) < 1e-6) return C(2); return cdiv(csub(C(1), cexp(cscale(a, -2))), a); },
          zeros: [C(-1, Math.PI), C(-1, -Math.PI)], poles: [], roc: [null, null], tex: 'X(s)=\\dfrac{1-e^{-2(s+1)}}{s+1}', sig: 'e^{-t},\\ 0<t<2' },
  ex97: { name: '9.7', k: -2, zeros: [], poles: [C(-1), C(1)], roc: [-1, 1], tex: 'X(s)=\\dfrac{-2}{s^2-1}', sig: 'e^{-|t|}' },
  ex98: { name: '9.8', k: 1, zeros: [], poles: [C(-1), C(-2)], roc: [-1, null], tex: 'X(s)=\\dfrac{1}{(s+1)(s+2)}', sig: '\\text{depends on the ROC}' },
  custom: { name: 'Your own', k: 1, zeros: [C(0.5, 1.5), C(0.5, -1.5)], poles: [C(-1, 2), C(-1, -2), C(-2.5)], roc: [-1, null], tex: '', sig: '' },
};
function strips(poles) {
  const xs = [...new Set(poles.map((p) => +p.re.toFixed(6)))].sort((a, b) => a - b);
  const out = [[null, xs[0] ?? null]];
  for (let i = 0; i < xs.length - 1; i++) out.push([xs[i], xs[i + 1]]);
  if (xs.length) out.push([xs[xs.length - 1], null]);
  return xs.length ? out : [[null, null]];
}
function stripName(roc, poles) {
  if (!poles.length) return 'the whole plane';
  if (roc[0] != null && roc[1] == null) return 'right of all poles: right-sided signal';
  if (roc[0] == null && roc[1] != null) return 'left of all poles: left-sided signal';
  if (roc[0] == null && roc[1] == null) return 'the whole plane';
  return 'a strip between poles: two-sided signal';
}
function rocTex(roc) {
  const [l, r] = roc;
  if (l == null && r == null) return '\\text{every } s';
  if (r == null) return `\\mathrm{Re}\\{s\\} > ${fmt(l, 2).replace(/\.?0+$/, '')}`;
  if (l == null) return `\\mathrm{Re}\\{s\\} < ${fmt(r, 2).replace(/\.?0+$/, '')}`;
  return `${fmt(l, 2).replace(/\.?0+$/, '')} < \\mathrm{Re}\\{s\\} < ${fmt(r, 2).replace(/\.?0+$/, '')}`;
}
function polyTex(k, roots, v = 's') {
  if (!roots.length) return fmt(k, 2).replace(/\.?0+$/, '');
  const parts = [];
  const used = new Set();
  roots.forEach((r, i) => {
    if (used.has(i)) return;
    const j = roots.findIndex((q, m) => m !== i && !used.has(m) && Math.abs(q.re - r.re) < 1e-6 && Math.abs(q.im + r.im) < 1e-6 && Math.abs(r.im) > 1e-6);
    if (j >= 0) {
      used.add(i); used.add(j);
      const b = -2 * r.re, c = r.re * r.re + r.im * r.im;
      parts.push(`(${v}^2 ${b < 0 ? '-' : '+'} ${fmt(Math.abs(b), 2).replace(/\.?0+$/, '')}${v} + ${fmt(c, 2).replace(/\.?0+$/, '')})`);
    } else {
      used.add(i);
      parts.push(Math.abs(r.re) < 1e-9 ? v : `(${v} ${r.re < 0 ? '+' : '-'} ${fmt(Math.abs(r.re), 2).replace(/\.?0+$/, '')})`);
    }
  });
  const kk = Math.abs(k - 1) < 1e-9 ? '' : fmt(k, 2).replace(/\.?0+$/, '');
  return kk + parts.join('');
}

stop({ id: 'poles', name: 'Poles', build() {

/* ---------------------------------------------------------- 7. ROC tester */
const ROCSIG = {
  ex91: { name: 'Ex 9.1', tex: 'e^{-t}u(t)', right: (t) => Math.exp(-t), left: null, roc: [-1, null], poles: [C(-1)] },
  ex92: { name: 'Ex 9.2', tex: '-e^{-t}u(-t)', right: null, left: (t) => -Math.exp(-t), roc: [null, -1], poles: [C(-1)] },
  ex97: { name: 'Ex 9.7', tex: 'e^{-|t|}', right: (t) => Math.exp(-t), left: (t) => Math.exp(t), roc: [-1, 1], poles: [C(-1), C(1)] },
  ex96: { name: 'Ex 9.6', tex: 'e^{-t},\\ 0<t<2', right: (t) => (t < 2 ? Math.exp(-t) : 0), left: null, roc: [null, null], poles: [], finite: 2 },
  grow: { name: 'Growing', tex: 'e^{2t}u(t)', right: (t) => Math.exp(2 * t), left: null, roc: [2, null], poles: [C(2)] },
};
stop({ id: 'roc', name: 'ROC tester', build() {
  const scene = makeScene(), labels = new Labels();
  const TR = 6, R = 1.8;
  const ct = complexTime(scene, labels, { t0: -TR, t1: TR, R, k: 0.95, x0: 0 });
  const { P } = ct;
  const st = { key: 'ex91', s: C(0, 2), seen: new Map() };

  const funnelMat = new THREE.MeshBasicMaterial({ color: COL.white, wireframe: true, transparent: true, opacity: 0.1 });
  let funnels = new THREE.Group(); scene.add(funnels);
  labels.add('t > 0', P(TR * 0.6, C(0, -1.9)), 'sm', CSS.faint);
  labels.add('t < 0', P(-TR * 0.6, C(0, -1.9)), 'sm', CSS.faint);
  function side(f, a, b) {
    const pts = []; if (!f) return pts;

    return pts;
  }
  function funnel(rate, a, b) {
    let lo = a, hi = b;
    if (rate > 1e-6) hi = Math.min(hi, Math.log(R) / rate); else if (rate < -1e-6) lo = Math.max(lo, Math.log(R) / rate);
    if (hi - lo < 0.05) return null;
    const nu = 30, nv = 20, ps = [], idx = [];
    for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) { const t = lo + (hi - lo) * i / nu, ang = 2 * Math.PI * j / nv, r = Math.exp(rate * t); ps.push(P(t, C(r * Math.cos(ang), r * Math.sin(ang)))); }
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) { const q = i * (nv + 1) + j, w = q + nv + 1; idx.push(q, w, q + 1, w, w + 1, q + 1); }
    const g = new THREE.BufferGeometry().setFromPoints(ps); g.setIndex(idx);
    return new THREE.Mesh(g, funnelMat);
  }
  const S = () => ROCSIG[st.key];
  function rebuild() {
    const sig = S();
    cr.set(side(sig.right, 0, sig.finite || TR)); cl.set(side(sig.left, -TR, 0));
    scene.remove(funnels); funnels.children.forEach((m) => m.geometry.dispose()); funnels = new THREE.Group(); scene.add(funnels);
    if (sig.right) { const f = funnel(-(st.s.re + 1) * (st.key === 'grow' ? 0 : 1) + (st.key === 'grow' ? 2 - st.s.re : 0), 0, sig.finite || TR); if (f) funnels.add(f); }
    if (sig.left) { const f = funnel(-(st.s.re) + (st.key === 'ex92' ? -1 : 1), -TR, 0); if (f) funnels.add(f); }
    const okR = !sig.right || sig.finite || inROC([st.key === 'grow' ? 2 : -1, null], st.s.re);
    const okL = !sig.left || inROC([null, st.key === 'ex92' ? -1 : 1], st.s.re);
    const ok = okR && okL;
    const key = Math.round(st.s.re * 20) / 20;
    st.seen.set(key, ok);
    pad.stripes = [...st.seen.entries()].map(([x, g]) => ({ x, color: g ? CSS.good : CSS.bad }));
    pad.handles[0].x = st.s.re; pad.handles[0].y = st.s.im;
    pad.poles = sig.poles.map((p) => ({ re: p.re, im: p.im }));
    pad.regions = showRoc.input.checked ? [{ l: sig.roc[0], r: sig.roc[1], color: CSS.roc, alpha: 0.2 }] : [];
    pad.draw();
    ro.cells.r.textContent = ''; ro.cells.l.textContent = '';
    if (sig.right) verdict(ro.cells.r, okR ? 'good' : 'bad', sig.finite ? 'finite stretch: always fine' : okR ? 'shrinks: converges' : 'grows: diverges'); else ro.cells.r.append('— (zero)');
    if (sig.left) verdict(ro.cells.l, okL ? 'good' : 'bad', okL ? 'shrinks as t → −∞' : 'grows as t → −∞'); else ro.cells.l.append('— (zero)');

    setTex(sigTex, 'x(t) = ' + sig.tex + ',\\qquad \\mathrm{ROC}: ' + rocTex(sig.roc));

    '\\big|x(t)\\,e^{-st}\\big| = |x(t)|\\,e^{-\\sigma t}');
  const pad = new SPad({ xr: [-3, 3], yr: [-3, 3], height: 230, onDrag: (h) => { st.s = C(h.x, h.y); rebuild(); } });
  pad.handles = [{ x: st.s.re, y: st.s.im, color: CSS.yellow, label: 's' }];
  const which = seg(Object.entries(ROCSIG).map(([k, v]) => [k, v.name]), st.key, (id) => { st.key = id; st.seen.clear(); rebuild(); });
  const showRoc = check('Show the ROC', false, () => rebuild());

    el('div', { class: 'chks' }, showRoc.el, clear), ro.el,
    notes(['Move the point straight up or down: nothing changes. Only $\\sigma$ matters, so the ROC is made of vertical strips.',
           'Right-sided parts need $\\sigma$ large enough; left-sided parts need $\\sigma$ small enough; two-sided signals need both, a strip.',
           'Ex 9.6 lives on a finite stretch of time, so every $s$ works.']));
  return { scene, labels, panel: sec, view: { target: [0, 0, 0], r: 17, theta: 0.6, phi: 1.12 }, enter() { pad.resize(); rebuild(); } };
} });

/* ---------------------------------------------------------- 8. inverse */
const INV = {

  two: { name: '1/((s+1)(s+2))', F: (s) => cdiv(C(1), cmul(cadd(s, C(1)), cadd(s, C(2)))), poles: [C(-1), C(-2)],
         answer: (roc) => {
           if (roc[0] === -1) return [(t) => (t >= 0 ? Math.exp(-t) - Math.exp(-2 * t) : 0), '(e^{-t}-e^{-2t})u(t)'];
           if (roc[1] === -2) return [(t) => (t < 0 ? -Math.exp(-t) + Math.exp(-2 * t) : 0), '(-e^{-t}+e^{-2t})u(-t)'];
           return [(t) => (t < 0 ? -Math.exp(-t) : -Math.exp(-2 * t)), '-e^{-t}u(-t)-e^{-2t}u(t)'];
         } },
};
stop({ id: 'inverse', name: 'Inverse', build() {
  const scene = makeScene(), labels = new Labels();
  const u0 = -3.5, u1 = 2, v0 = -5, v1 = 5;
  sFloor(scene, labels, { u0, u1, v0, v1 });
  const st = { key: 'one', sigma: 0.5, W: 20 };
  const land = new Landscape({ u0, u1, v0, v1, nu: 110, nv: 150, zmax: 3.5, hscale: 0.8, map: (u, v, h) => V(u, h, -v) });

  const marks = new THREE.Group(); scene.add(marks);
  let lastKey = null;
  function rocOf() { return strips(INV[st.key].poles).find(([l, r]) => (l == null || st.sigma > l) && (r == null || st.sigma < r)); }
  function invert(t) {

    }
    return acc * dw / Math.PI;
  }
  function rebuild() {
    const inv = INV[st.key];
    if (lastKey !== st.key) { land.setFunction(inv.F); lastKey = st.key; marks.clear(); for (const p of inv.poles) marks.add(poleMark(V(p.re, 0.01, -p.im))); }

    line.set([V(st.sigma, 0.02, -v0), V(st.sigma, 0.02, -v1)]);
    const pts = []; for (let i = 0; i <= 400; i++) { const w = v0 + (v1 - v0) * i / 400; const h = cabs(inv.F(C(st.sigma, w))); pts.push(h < 3.5 ? V(st.sigma, h * 0.8 + 0.03, -w) : null); }

    const [f, ftex] = inv.answer(roc);

    const interp = (t) => { const x = (t + 4) / 8 * 160; const i = Math.max(0, Math.min(159, Math.floor(x))); const a = samples[i][1], b = samples[i + 1][1]; return a + (b - a) * (x - i); };
    plot.yr = st.key === 'one' ? [-2.5, 1.4] : [-1.6, 1];
    plot.curves = [{ f, color: CSS.muted, width: 2, dash: [6, 5], breaks: [0] }, { f: interp, color: CSS.yellow, width: 2.6 }];
    plot.draw();
    pad.poles = inv.poles.map((p) => ({ re: p.re, im: p.im })); pad.regions = [{ l: roc[0], r: roc[1], color: CSS.roc, alpha: 0.2 }];
    pad.handles[0].x = st.sigma; pad.draw();

  }

  const sec = panelSection('Inverse: walk up a line', 'Add up X(s)e^{st} along a vertical line inside the ROC. Slide the line past a pole and the same X(s) gives a different signal.',

    let x = h.x; for (const p of INV[st.key].poles) if (Math.abs(x - p.re) < 0.06) x = p.re + (x < p.re ? -0.06 : 0.06);

} });

/* ---------------------------------------------------------- 9. partial fractions */

/* ============================================================== navigation and the render loop */
const nav = document.getElementById('stops');
const panelRoot = document.getElementById('panel');
const stopName = document.getElementById('stopname');
let current = null;
STOPS.forEach((s, i) => {
  const b = el('button', { type: 'button', 'aria-current': 'false' }, el('span', { class: 'n' }, String(i + 1)));
  if (s.name.includes('^')) b.append(tex(s.name)); else b.append(s.name);
  b.addEventListener('click', () => show(s.id));
  nav.append(b); s.btn = b;
});
function show(id) {
  const s = STOPS.find((x) => x.id === id) || STOPS[0];

  if (current) { current.inst.labels.root.hidden = true; current.inst.panel.hidden = true; current.btn.setAttribute('aria-current', 'false'); }
  if (!s.inst) { s.inst = s.build(); panelRoot.append(s.inst.panel); }
  current = s;
  s.btn.setAttribute('aria-current', 'true'); s.btn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  s.inst.labels.root.hidden = false; s.inst.panel.hidden = false;
  stopName.textContent = ''; stopName.append(STOPS.indexOf(s) + 1 + '  ', s.name.includes('^') ? tex(s.name) : s.name);
  orbit.set(s.inst.view, !!s.visited); s.visited = true;
  if (s.inst.enter) s.inst.enter();
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
}
function step(d) { const i = STOPS.indexOf(current); show(STOPS[(i + d + STOPS.length) % STOPS.length].id); }
document.getElementById('bReset').onclick = () => orbit.set(current.inst.view, true);
document.getElementById('bFull').onclick = () => { document.body.classList.toggle('full'); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
  else if (e.key === 'r' || e.key === 'R') orbit.set(current.inst.view, true);
  else if (e.key === 'p' || e.key === 'P') document.body.classList.toggle('full');
  else return;
  e.preventDefault();
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const w = viewport.clientWidth, h = viewport.clientHeight;
  if (renderer && w > 0 && h > 0) {
    const need = renderer.getSize(new THREE.Vector2());
    if (need.x !== w || need.y !== h) {
      renderer.setSize(w, h, false); camera.aspect = w / h;
      // keep the horizontal field of view on narrow screens instead of cropping the sides
      const a = w / h;
      camera.fov = a >= 1.6 ? 36 : Math.min(80, 2 * Math.atan(Math.tan(18 * Math.PI / 180) * 1.6 / a) * 180 / Math.PI);
      camera.updateProjectionMatrix();
    }
    if (current) {
      if (current.inst.tick) current.inst.tick(dt);
      orbit.update(dt);
      renderer.render(current.inst.scene, camera);
      current.inst.labels.update(w, h);
    }
  }
  requestAnimationFrame(frame);
}
show((location.hash || '').slice(1) || 'euler');
requestAnimationFrame(frame);
})();
</script>
